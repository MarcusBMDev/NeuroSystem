default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: 5
  username: root
  password: ""
  host: 127.0.0.1
  default_file: <%= Rails.root.join('config/my.cnf') %>
  ssl_mode: :disabled

development:
  # BANCO 1: O banco do nosso Microserviço (Leitura e Escrita)
  primary:
    <<: *default
    database: agendamentos_clinica_dev

  # BANCO 2: O banco do NeuroChatService (Leitura e Escrita)
  neurochat:
    <<: *default
    database: neurochat_db
    database_tasks: false

test:
  # BANCO 1: Banco de testes principal
  primary:
    <<: *default
    database: agendamentos_clinica_test

  # BANCO 2: Banco neurochat isolado para testes
  neurochat:
    <<: *default
    database: neurochat_test
    database_tasks: false

production:
  primary:
    <<: *default
    database: agendamentos_clinica_dev
  neurochat:
    <<: *default
    database: neurochat_db
    database_tasks: false
  # Usando o banco de desenvolvimento que está sendo usado em produção
  cable:
    <<: *default
    database: agendamentos_clinica_dev
  queue:
    <<: *default
    database: agendamentos_clinica_dev
  cache:
    <<: *default
    database: agendamentos_clinica_dev